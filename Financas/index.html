<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Gastos</title>
  <link rel="stylesheet" href="../shared/global.css">
  <link rel="stylesheet" href="financas.css">
  <script src="financas.js" defer></script>
  <script src="../shared/back.js" defer></script>
  <script src="../shared/theme.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Controle de Gastos</h1>

    <!-- SALDO: o JS vai escrever o total aqui dentro -->
    <section class="saldo-card">
      <p class="saldo-label">Saldo atual</p>
      <p class="saldo-valor" id="saldo">R$ 0,00</p>
      <div class="resumo">
        <span class="entrada">Entradas: <strong id="total-entradas">R$ 0,00</strong></span>
        <span class="saida">Saídas: <strong id="total-saidas">R$ 0,00</strong></span>
      </div>
    </section>

    <!-- FORMULÁRIO: o JS vai ler estes campos quando o usuário adicionar -->
    <section class="card form-card">
      <h2>Nova transação</h2>
      <form id="form-transacao">
        <div class="campo">
          <label for="descricao">Descrição</label>
          <input type="text" id="descricao" placeholder="Ex: Comissão scooter" required>
        </div>

        <div class="campo">
          <label for="valor">Valor (R$)</label>
          <input type="number" id="valor" placeholder="0,00" step="0.01" min="0" required>
        </div>

        <div class="campo">
          <label for="tipo">Tipo</label>
          <select id="tipo" required>
            <option value="entrada">Entrada</option>
            <option value="saida">Saída</option>
          </select>
        </div>

        <div class="campo">
          <label for="categoria">Categoria</label>
          <select id="categoria" required>
            <option value="salario">Salário</option>
            <option value="comissao">Comissão</option>
            <option value="alimentacao">Alimentação</option>
            <option value="transporte">Transporte</option>
            <option value="lazer">Lazer</option>
            <option value="outros">Outros</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Adicionar</button>
      </form>
    </section>

    <!-- LISTA: o JS vai criar um <li> aqui dentro pra cada transação -->
    <section class="card lista-card">
      <h2>Transações</h2>
      <ul id="lista-transacoes"></ul>
    </section>
  </main>

</body>
</html>
